[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-storage"
authors = [{ name = "Etalab", email = "etalab@data.gouv.fr" }]
readme = "README.md"
dynamic = ["version"]
description = "Simple and easy file storages for Flask"
requires-python = ">=3.11"
dependencies = [
    "Flask >= 2.1, < 4.0",
    "Pillow >= 9.2, < 13",
    # 1.36 is the first release exposing `ChecksumType`, which the S3 backend
    # needs to ask for a checksum of the whole object rather than of its parts.
    "boto3 >= 1.36, < 2.0",
    "mongoengine >= 0.29.1, < 1.0.0",
    "werkzeug >= 2.2.3, < 4.0.0",
]

[project.urls]
Home = "https://github.com/etalab/flask-storage"

[project.entry-points.'storage.backend']
local = "flask_storage.backends.local:LocalBackend"
s3 = "flask_storage.backends.s3:S3Backend"
mock = "flask_storage.backends.mock:MockBackend"

[dependency-groups]
dev = [
    "pytest >= 7.1, < 8.0",
    "pytest-faker >= 2.0, < 3.0",
    "pytest-flask >= 1.2, < 2.0",
    "pytest-sugar >= 0.9, < 1.0",
    "pytest-mock >= 3.8, < 4.0",
    "ruff >= 0.11.0, < 1.0",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["flask_storage*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["*Test"]
