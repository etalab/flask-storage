---
version: 2.1

jobs:
  build:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-trixie
      - image: mongo:6.0.4
      # MinIO no longer publishes its image, same server as udata's CI.
      - image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        environment:
          RUSTFS_ACCESS_KEY: ABCDEFGHIJKLMNOQRSTU
          RUSTFS_SECRET_KEY: abcdefghiklmnoqrstuvwxyz1234567890abcdef
    environment:
      BASH_ENV: /root/.bashrc
    steps:
      - checkout
      - restore_cache:
          keys:
            # 1. Exact match of dependencies
            - py-cache-v4-{{ arch }}-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            # 2. Latest cache from this branch
            - py-cache-v4-{{ arch }}-{{ .Branch }}
            # 3. Any latest cache for this architecture (fallback)
            - py-cache-v4-{{ arch }}-
      - run:
          name: Install Python dependencies
          command: |
            uv sync --frozen
      - save_cache:
          key: py-cache-v4-{{ arch }}-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - .venv
      - save_cache:
          key: py-cache-v4-{{ arch }}-{{ .Branch }}
          paths:
            - .venv
      - run:
          name: Lint and format code
          command: |
            uv run ruff check .
            uv run ruff format --check .
      - run:
          name: Run tests
          command: |
            uv run pytest -ra
      - run:
          name: Build a distributable package
          command: |
            uv build
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - .

  publish:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-trixie
    steps:
      - attach_workspace:
          at: .
      - deploy:
          name: Publish on PyPI
          command: |
            uv publish dist/flask_storage-*.whl  # use UV_PUBLISH_TOKEN

workflows:
  build:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - /[0-9]+(\.[0-9]+)+/
          context: org-global
